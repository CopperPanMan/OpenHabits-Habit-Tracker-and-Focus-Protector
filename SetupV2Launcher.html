<!doctype html>
<html><head><base target="_blank"><meta name="viewport" content="width=device-width,initial-scale=1"><?!= openHabitsInclude_('SetupV2Styles'); ?></head>
<body class="launcher-body">
  <main class="launcher-shell">
    <h1>Configuration bridge</h1>
    <p>Edit in the canonical browser editor, then return here to validate and apply the JSON to this Sheet.</p>
    <section class="panel">
      <h2>1. Export and edit</h2>
      <div class="row gap">
        <button id="copyCurrent" type="button">Copy Current Config</button>
        <a class="button-link secondary" href="<?= editorUrl ?>">Open Config Editor ↗</a>
      </div>
      <p id="revision" class="status">Loading current configuration…</p>
    </section>
    <section class="panel">
      <h2>2. Import updated JSON</h2>
      <label for="configJson">Paste JSON</label>
      <textarea id="configJson" rows="14" placeholder="Paste the JSON copied or downloaded from the browser editor"></textarea>
      <label class="file-label" for="configFile">Or choose a .json file</label>
      <input id="configFile" type="file" accept="application/json,.json">
      <div class="row gap"><button id="preview" class="secondary" type="button">Preview Changes</button><button id="save" type="button" disabled>Save and Apply</button></div>
      <div id="result" class="status" aria-live="polite"></div>
    </section>
    <button id="restore" class="danger" type="button">Restore Previous Revision</button>
  </main>
<script>
(() => {
  const json = document.getElementById('configJson');
  const result = document.getElementById('result');
  const save = document.getElementById('save');
  let currentJson = '';
  const server = (name, value, success) => google.script.run.withSuccessHandler(success).withFailureHandler(error => {
    result.textContent = 'Error: ' + error.message;
    save.disabled = true;
  })[name](value);
  google.script.run.withSuccessHandler(data => {
    currentJson = data.configJson;
    document.getElementById('revision').textContent = data.revision ? 'Active revision ' + data.revision : 'Using the code-backed fallback (not yet imported).';
  }).withFailureHandler(error => { result.textContent = 'Error: ' + error.message; }).openHabitsGetConfigBridgeData();
  document.getElementById('copyCurrent').addEventListener('click', async () => {
    if (!currentJson) return;
    try { await navigator.clipboard.writeText(currentJson); result.textContent = 'Current JSON copied. Paste it into the browser editor.'; }
    catch (_) { json.value = currentJson; json.focus(); json.select(); result.textContent = 'Clipboard access was blocked. Copy the selected JSON below.'; }
  });
  document.getElementById('configFile').addEventListener('change', async event => {
    const file = event.target.files[0];
    if (file) json.value = await file.text();
    save.disabled = true;
    result.textContent = file ? 'Loaded ' + file.name + '. Preview it before saving.' : '';
  });
  json.addEventListener('input', () => { save.disabled = true; result.textContent = 'Preview required before saving.'; });
  document.getElementById('preview').addEventListener('click', () => {
    result.textContent = 'Validating…';
    server('openHabitsPreviewConfig', json.value, preview => {
      if (!preview.ok) { result.textContent = 'Cannot apply: ' + (preview.errors || []).join(' '); save.disabled = true; return; }
      const plan = preview.plan;
      result.textContent = 'Valid JSON. ' + plan.missing.length + ' row(s) will be added; ' + plan.retainedUnreferenced.length + ' historical row(s) will be retained.' + ((preview.warnings || []).length ? ' Warnings: ' + preview.warnings.join(' ') : '');
      save.disabled = false;
    });
  });
  save.addEventListener('click', () => {
    save.disabled = true; result.textContent = 'Saving…';
    server('openHabitsSaveAndApply', json.value, response => {
      result.textContent = response.ok ? 'Saved revision ' + response.revision + '. Added ' + response.addedRows.length + ' row(s).' : 'Cannot apply: ' + (response.errors || []).join(' ');
      if (response.ok) currentJson = json.value;
    });
  });
  document.getElementById('restore').addEventListener('click', () => {
    if (!confirm('Restore the previous configuration as a new active revision?')) return;
    server('openHabitsRestorePreviousRevision', null, response => { result.textContent = response.ok ? 'Restored as revision ' + response.revision + '.' : (response.errors || []).join(' '); });
  });
})();
</script></body></html>
